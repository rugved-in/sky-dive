<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>Sky Dash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    body {
      background: #060c1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    canvas {
      display: block;
      cursor: pointer;
      touch-action: none;
      /* Scale to fit the viewport while keeping 900:400 aspect ratio */
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      aspect-ratio: 900 / 400;
    }
    #hint {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(150, 200, 255, 0.4);
      letter-spacing: 1px;
      text-align: center;
      padding: 0 12px;
    }
    @media (max-height: 380px) {
      #hint { display: none; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">HOLD SPACE / ↑ to climb · release to dive · tap &amp; hold on mobile</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = 900;
canvas.height = 400;

const GY = canvas.height - 65; // ground y

// ── Game state ────────────────────────────────────────────────────
let state = 'idle'; // idle | running | dead
let score = 0, bestScore = 0, frame = 0, spd = 5;
let holdUp = false, planeVisible = true;

// ── Input ─────────────────────────────────────────────────────────
const onPress = () => { if (state !== 'running') startGame(); else holdUp = true; };
const onRelease = () => { holdUp = false; };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onPress(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') onRelease();
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onPress(); });
canvas.addEventListener('pointerup', onRelease);
canvas.addEventListener('pointerleave', onRelease);

// ── Plane ─────────────────────────────────────────────────────────
const P = {
  x: 140, y: canvas.height / 2, vy: 0,
  GRAV: 0.48, THRUST: -0.85, VMAX_UP: -9, VMAX_DN: 13,

  reset() { this.y = canvas.height / 2; this.vy = 0; },

  update() {
    this.vy = holdUp
      ? Math.max(this.vy + this.THRUST, this.VMAX_UP)
      : Math.min(this.vy + this.GRAV,   this.VMAX_DN);
    this.y += this.vy;
    if (this.y < 30)    { this.y = 30;  this.vy = 0; }
    if (this.y > GY - 6){ this.y = GY - 6; die(); }
  },

  draw(flicker = true) {
    ctx.save();
    ctx.translate(this.x, this.y);
    const tilt = Math.max(-0.35, Math.min(0.35, this.vy * 0.038));
    ctx.rotate(tilt);

    // engine glow
    const eg = ctx.createRadialGradient(-34, 0, 1, -34, 0, 22);
    eg.addColorStop(0, 'rgba(255,160,30,.8)');
    eg.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(-34, 0, 22, 0, Math.PI * 2); ctx.fill();

    // flame
    if (flicker) {
      const fl = 10 + Math.random() * 16;
      ctx.fillStyle = '#ff7800';
      ctx.beginPath();
      ctx.moveTo(-34, -5); ctx.lineTo(-34 - fl, 0); ctx.lineTo(-34, 5); ctx.fill();
      ctx.fillStyle = '#ffe060';
      ctx.beginPath();
      ctx.moveTo(-34, -2); ctx.lineTo(-34 - fl * .5, 0); ctx.lineTo(-34, 2); ctx.fill();
    }

    // fuselage
    ctx.fillStyle = '#ddeaf8';
    ctx.beginPath();
    ctx.moveTo(36, 0);
    ctx.bezierCurveTo(36, -6, 18, -10, 0, -10);
    ctx.lineTo(-30, -8);
    ctx.lineTo(-36, -4);
    ctx.lineTo(-36,  4);
    ctx.lineTo(-30,  8);
    ctx.lineTo(0,   10);
    ctx.bezierCurveTo(18, 10, 36, 6, 36, 0);
    ctx.closePath(); ctx.fill();

    // main wing (top)
    ctx.fillStyle = '#b0c8de';
    ctx.beginPath();
    ctx.moveTo(8, -10); ctx.lineTo(-16, -38); ctx.lineTo(-30, -32); ctx.lineTo(-32, -8);
    ctx.closePath(); ctx.fill();

    // main wing (bottom)
    ctx.beginPath();
    ctx.moveTo(8,  10); ctx.lineTo(-16,  38); ctx.lineTo(-30,  32); ctx.lineTo(-32,  8);
    ctx.closePath(); ctx.fill();

    // tail fin (vertical)
    ctx.fillStyle = '#98b4c8';
    ctx.beginPath();
    ctx.moveTo(-24, -8); ctx.lineTo(-18, -28); ctx.lineTo(-36, -18); ctx.lineTo(-36, -8);
    ctx.closePath(); ctx.fill();

    // horizontal stabiliser
    ctx.fillStyle = '#a8bece';
    ctx.beginPath();
    ctx.moveTo(-28, -8); ctx.lineTo(-36, -18); ctx.lineTo(-36, -8);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-28,  8); ctx.lineTo(-36,  18); ctx.lineTo(-36,  8);
    ctx.closePath(); ctx.fill();

    // cockpit glass
    ctx.fillStyle = 'rgba(110,220,255,.82)';
    ctx.beginPath();
    ctx.ellipse(20, -2, 14, 7, 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,160,220,.6)'; ctx.lineWidth = 1;
    ctx.stroke();

    // fuselage stripe
    ctx.strokeStyle = 'rgba(70,130,200,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(22, -4); ctx.lineTo(-20, -6); ctx.stroke();

    ctx.restore();
  },

  // tight hitbox (center rectangle)
  hb() { return { x: this.x - 22, y: this.y - 13, w: 42, h: 26 }; }
};

// ── Obstacles ─────────────────────────────────────────────────────
const obs = [];

function spawnObstacles() {
  const r = Math.random();
  if (r < 0.55) {
    obs.push(makePeak());
  } else if (r < 0.80) {
    // gated pair: bottom peak + top stalactite with a gap
    const o = makePeak();
    const gap = 115 + Math.random() * 90;
    o.topH = GY - o.h - gap;
    if (o.topH > 25) o.hasTop = true;
    obs.push(o);
  } else {
    // twin peaks close together
    const a = makePeak(); obs.push(a);
    const b = makePeak(); b.x = a.x + a.w + 15 + Math.random() * 25; obs.push(b);
  }
}

function makePeak() {
  const h = 55 + Math.random() * 125;
  const w = 38 + Math.random() * 48;
  const l = 18 + Math.random() * 18;
  return {
    x: canvas.width + 70, w, h,
    y: GY - h,
    hasTop: false, topH: 0,
    fill:  `hsl(214,22%,${l}%)`,
    snow:  `hsl(214,22%,${l + 18}%)`
  };
}

function drawObstacles() {
  for (const o of obs) {
    // mountain body
    ctx.fillStyle = o.fill;
    ctx.beginPath();
    ctx.moveTo(o.x,          GY);
    ctx.lineTo(o.x + o.w/2,  o.y);
    ctx.lineTo(o.x + o.w,    GY);
    ctx.closePath(); ctx.fill();

    // snow cap
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath();
    ctx.moveTo(o.x + o.w/2,      o.y);
    ctx.lineTo(o.x + o.w/2 - 11, o.y + 24);
    ctx.lineTo(o.x + o.w/2 + 11, o.y + 24);
    ctx.closePath(); ctx.fill();

    // top stalactite
    if (o.hasTop && o.topH > 0) {
      ctx.fillStyle = `hsl(214,18%,14%)`;
      ctx.beginPath();
      ctx.moveTo(o.x + o.w * 0.08,  0);
      ctx.lineTo(o.x + o.w / 2,     o.topH);
      ctx.lineTo(o.x + o.w * 0.92,  0);
      ctx.closePath(); ctx.fill();
      // stalactite highlight
      ctx.fillStyle = 'rgba(255,255,255,.1)';
      ctx.beginPath();
      ctx.moveTo(o.x + o.w/2,      o.topH);
      ctx.lineTo(o.x + o.w/2 - 8,  o.topH - 20);
      ctx.lineTo(o.x + o.w/2 + 8,  o.topH - 20);
      ctx.closePath(); ctx.fill();
    }
  }
}

function updateObstacles() {
  for (let i = obs.length - 1; i >= 0; i--) {
    obs[i].x -= spd;
    if (obs[i].x + obs[i].w < 0) obs.splice(i, 1);
  }
}

function checkHits() {
  const h = P.hb();
  const cx = h.x + h.w / 2;
  const cy = h.y + h.h / 2;
  for (const o of obs) {
    if (cx < o.x || cx > o.x + o.w) continue;
    const frac = (cx - o.x) / o.w;
    const peakX = o.x + o.w / 2;
    const halfBase = o.w / 2;
    // mountain surface y at cx
    const surfY = o.y + (o.h * Math.abs(cx - peakX) / halfBase);
    if (cy > surfY - 4) { die(); return; }
    // top stalactite
    if (o.hasTop && o.topH > 0) {
      const stSurfY = o.topH * (1 - Math.abs(cx - peakX) / halfBase);
      if (cy < stSurfY + 4) { die(); return; }
    }
  }
}

// ── Clouds ────────────────────────────────────────────────────────
const clouds = [];
function mkCloud(x) {
  return {
    x: x ?? canvas.width + 60,
    y: 18 + Math.random() * (GY - 55),
    r: 28 + Math.random() * 52,
    spd: 0.4 + Math.random() * 1.1,
    a: 0.06 + Math.random() * 0.16
  };
}
for (let i = 0; i < 7; i++) clouds.push(mkCloud(Math.random() * canvas.width));

function updateClouds() {
  for (let i = clouds.length - 1; i >= 0; i--) {
    clouds[i].x -= clouds[i].spd * (spd / 5);
    if (clouds[i].x + clouds[i].r * 2.8 < 0) clouds.splice(i, 1);
  }
  if (frame % 85 === 0) clouds.push(mkCloud());
}

function drawClouds() {
  for (const c of clouds) {
    ctx.save(); ctx.globalAlpha = c.a;
    ctx.fillStyle = '#d8eeff';
    ctx.beginPath();
    ctx.arc(c.x,           c.y,           c.r,       0, Math.PI * 2);
    ctx.arc(c.x + c.r*.7,  c.y - c.r*.28, c.r*.72,   0, Math.PI * 2);
    ctx.arc(c.x + c.r*1.4, c.y,           c.r*.82,   0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Particles ─────────────────────────────────────────────────────
const parts = [];
function explode(x, y) {
  for (let i = 0; i < 35; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 7;
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      life: 1, r: 2 + Math.random()*4, hue: 15 + Math.random()*45 });
  }
}
function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.life -= 0.022;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue},100%,60%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();
  }
}

// ── Speed lines ───────────────────────────────────────────────────
const speedLines = Array.from({length: 18}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * GY,
  len: 20 + Math.random() * 50,
  a: 0.03 + Math.random() * 0.1
}));
function drawSpeedLines() {
  for (const l of speedLines) {
    l.x -= spd * 1.8;
    if (l.x + l.len < 0) { l.x = canvas.width + l.len; l.y = Math.random() * GY; }
    ctx.strokeStyle = `rgba(180,220,255,${l.a})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke();
  }
}

// ── Static star positions ─────────────────────────────────────────
const STARS = Array.from({length: 65}, (_, i) => ({
  x: (i * 181 + 17) % canvas.width,
  y: (i * 113 + 9)  % (GY * 0.88),
  r: i % 5 === 0 ? 1.5 : 0.7
}));

let gndOff = 0;

// ── Draw background ───────────────────────────────────────────────
function drawBg() {
  const sky = ctx.createLinearGradient(0, 0, 0, GY);
  sky.addColorStop(0,   '#060c1a');
  sky.addColorStop(0.5, '#0d1f3e');
  sky.addColorStop(1,   '#163458');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, GY);

  for (const s of STARS) {
    const tw = 0.45 + Math.sin(frame * 0.04 + s.x * 0.1) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // horizon ambient glow
  const hg = ctx.createLinearGradient(0, GY - 90, 0, GY);
  hg.addColorStop(0, 'rgba(30,90,180,0)');
  hg.addColorStop(1, 'rgba(50,130,220,.2)');
  ctx.fillStyle = hg; ctx.fillRect(0, GY - 90, canvas.width, 90);
}

function drawGround() {
  const g = ctx.createLinearGradient(0, GY, 0, canvas.height);
  g.addColorStop(0, '#172817'); g.addColorStop(1, '#0a140a');
  ctx.fillStyle = g; ctx.fillRect(0, GY, canvas.width, canvas.height - GY);

  ctx.strokeStyle = '#2d6535'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GY); ctx.lineTo(canvas.width, GY); ctx.stroke();

  ctx.save();
  ctx.strokeStyle = 'rgba(70,170,70,.3)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([22, 38]); ctx.lineDashOffset = -gndOff;
  ctx.beginPath(); ctx.moveTo(0, GY + 16); ctx.lineTo(canvas.width, GY + 16); ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(190,225,255,.9)';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillText(String(Math.floor(score)).padStart(5, '0'), canvas.width - 18, 38);

  ctx.fillStyle = 'rgba(140,190,255,.45)';
  ctx.font = '13px "Courier New"';
  ctx.fillText('HI ' + String(Math.floor(bestScore)).padStart(5, '0'), canvas.width - 18, 58);

  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(100,180,255,.4)';
  ctx.font = '12px "Courier New"';
  ctx.fillText('SPD ' + spd.toFixed(1), 14, canvas.height - 18);
}

// ── Overlay screens ────────────────────────────────────────────────
function drawIdle() {
  ctx.fillStyle = 'rgba(4,9,22,.72)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#d0e8ff';
  ctx.font = 'bold 58px "Courier New"';
  ctx.fillText('SKY DASH', canvas.width/2, canvas.height/2 - 52);

  ctx.fillStyle = 'rgba(180,215,255,.75)';
  ctx.font = '18px "Courier New"';
  ctx.fillText('HOLD SPACE (or ↑) to climb · release to dive', canvas.width/2, canvas.height/2 + 8);

  ctx.fillStyle = 'rgba(130,180,255,.85)';
  ctx.font = 'bold 16px "Courier New"';
  const blink = Math.floor(frame / 28) % 2 === 0;
  if (blink) ctx.fillText('▶  Press SPACE or tap to start  ◀', canvas.width/2, canvas.height/2 + 52);
}

function drawDead() {
  ctx.fillStyle = 'rgba(4,9,22,.74)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5050';
  ctx.font = 'bold 54px "Courier New"';
  ctx.fillText('CRASHED!', canvas.width/2, canvas.height/2 - 52);

  const isHi = score > 0 && score >= bestScore;
  ctx.fillStyle = isHi ? '#ffd700' : 'rgba(190,225,255,.9)';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillText(
    isHi ? `★  NEW BEST: ${Math.floor(score)}  ★` : `SCORE: ${Math.floor(score)}`,
    canvas.width/2, canvas.height/2 + 8
  );

  if (!isHi && bestScore > 0) {
    ctx.fillStyle = 'rgba(140,190,255,.5)';
    ctx.font = '14px "Courier New"';
    ctx.fillText(`BEST: ${Math.floor(bestScore)}`, canvas.width/2, canvas.height/2 + 35);
  }

  ctx.fillStyle = 'rgba(130,180,255,.8)';
  ctx.font = 'bold 16px "Courier New"';
  const blink = Math.floor(frame / 28) % 2 === 0;
  if (blink) ctx.fillText('▶  Press SPACE or tap to retry  ◀', canvas.width/2, canvas.height/2 + 72);
}

// ── Lifecycle ─────────────────────────────────────────────────────
function startGame() {
  state = 'running'; score = 0; frame = 0; spd = 5;
  obs.length = 0; parts.length = 0;
  P.reset();
}

function die() {
  if (state !== 'running') return;
  state = 'dead';
  if (score > bestScore) bestScore = score;
  explode(P.x, P.y);
}

// ── Main loop ─────────────────────────────────────────────────────
function loop() {
  if (state === 'running') {
    frame++;
    score += 0.13;
    spd = 5 + Math.floor(score / 75) * 0.55;
    gndOff = (gndOff + spd) % 60;

    const interval = Math.max(52, 115 - Math.floor(score / 55) * 5);
    if (frame % interval === 0) spawnObstacles();

    updateObstacles();
    updateClouds();
    P.update();
    checkHits();
  } else {
    frame++;
  }
  updateParts();

  // ── render ──
  drawBg();
  if (state === 'running') drawSpeedLines();
  drawClouds();
  drawObstacles();
  drawGround();

  if (state === 'running')      P.draw(true);
  else if (state === 'idle')    P.draw(false);
  // dead: plane hidden, particles show wreckage

  drawParts();
  drawHUD();

  if (state === 'idle') drawIdle();
  if (state === 'dead') drawDead();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
